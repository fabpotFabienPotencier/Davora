name: Build Android App (APK & AAB Bundle)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Build Next.js Static Export
      run: npm run build
      env:
        EXPORT_MOBILE: 'true'

    - name: Install Capacitor Core & Android
      run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/browser@6 @capacitor/push-notifications@6

    - name: Add and Sync Android Platform
      run: |
        npx cap add android
        if [ -f "google-services.json" ]; then
          cp google-services.json android/app/google-services.json
          echo "google-services.json successfully copied to android/app/"
        else
          echo "Warning: google-services.json not found in root"
        fi
        npx cap sync android

    - name: Generate and Apply Davora App Icons & Splash
      run: |
        python3 -m pip install Pillow
        python3 -c '
from PIL import Image
import os

icon_path = ".github/workflows/app_icon.png"
if not os.path.exists(icon_path):
    print("Warning: app_icon.png not found at " + icon_path)
    exit(0)

img = Image.open(icon_path).convert("RGBA")
res_dir = "android/app/src/main/res"

densities = {
    "mipmap-mdpi": (48, 108),
    "mipmap-hdpi": (72, 162),
    "mipmap-xhdpi": (96, 216),
    "mipmap-xxhdpi": (144, 324),
    "mipmap-xxxhdpi": (192, 432)
}

for folder, (icon_size, fg_size) in densities.items():
    folder_path = os.path.join(res_dir, folder)
    os.makedirs(folder_path, exist_ok=True)
    
    icon_resized = img.resize((icon_size, icon_size), Image.Resampling.LANCZOS)
    icon_resized.save(os.path.join(folder_path, "ic_launcher.png"), "PNG")
    icon_resized.save(os.path.join(folder_path, "ic_launcher_round.png"), "PNG")
    
    fg_resized = img.resize((fg_size, fg_size), Image.Resampling.LANCZOS)
    fg_resized.save(os.path.join(folder_path, "ic_launcher_foreground.png"), "PNG")

bg_xml = os.path.join(res_dir, "values", "ic_launcher_background.xml")
os.makedirs(os.path.dirname(bg_xml), exist_ok=True)
with open(bg_xml, "w", encoding="utf-8") as f:
    f.write("""<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="ic_launcher_background">#FFFFFF</color>
</resources>
""")

for root, dirs, files in os.walk(res_dir):
    for f in files:
        if f == "splash.png":
            img.save(os.path.join(root, f), "PNG")

print("Davora app icons and branding successfully applied!")
'

    - name: Update Android App Version
      run: |
        sed -i 's/versionCode 1/versionCode 7/g' android/app/build.gradle
        sed -i 's/versionName "1.0"/versionName "2.0.0"/g' android/app/build.gradle

    - name: Update Android SDK Configuration
      run: |
        sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/g' android/variables.gradle
        sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/g' android/variables.gradle
        echo "subprojects { configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7' } }" >> android/build.gradle

    - name: Add Permissions to AndroidManifest
      run: |
        sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml
        sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml

    - name: Upgrade Gradle Wrapper to 8.5
      run: |
        sed -i 's/gradle-8.2.1-all.zip/gradle-8.5-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

    - name: Build Android Binaries
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        ./gradlew bundleDebug
        ./gradlew bundleRelease

    - name: Sign Release AAB Bundle
      run: |
        echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 --decode > android/davora.keystore
        AAB_FILE=$(find android/app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
        echo "Found AAB file: $AAB_FILE"
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore android/davora.keystore "$AAB_FILE" ${{ secrets.ANDROID_ALIAS }} -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} -keypass ${{ secrets.ANDROID_KEY_PASSWORD }}

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: davora-android-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Debug AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: davora-android-debug-aab
        path: android/app/build/outputs/bundle/debug/app-debug.aab

    - name: Upload Release AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: davora-android-release-aab
        path: android/app/build/outputs/bundle/release/*.aab