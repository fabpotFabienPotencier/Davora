name: Build Android App (APK & AAB Bundle)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Build Next.js Static Export
      run: npm run build
      env:
        EXPORT_MOBILE: 'true'

    - name: Install Capacitor Core & Android
      run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/browser@6

    - name: Add and Sync Android Platform
      run: |
        npx cap add android
        npx cap sync android

    - name: Update Android App Version
      run: |
        sed -i 's/versionCode 1/versionCode 8/g' android/app/build.gradle
        sed -i 's/versionName "1.0"/versionName "1.0.4"/g' android/app/build.gradle

    - name: Set up Python for Icon & Splash Generation
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Generate Custom Davora App Icons & Splash Screens
      run: |
        python -m pip install Pillow
        python -c '
import os
from PIL import Image

src_icon = ".github/workflows/app_icon.png"
if not os.path.exists(src_icon):
    src_icon = "app_icon.png"

img = Image.open(src_icon).convert("RGBA")
res_dir = "android/app/src/main/res"

# 1. Launcher and Round icons
mipmap_sizes = {
    "mipmap-mdpi": (48, 48),
    "mipmap-hdpi": (72, 72),
    "mipmap-xhdpi": (96, 96),
    "mipmap-xxhdpi": (144, 144),
    "mipmap-xxxhdpi": (192, 192),
}

# 2. Adaptive Foreground icons
foreground_sizes = {
    "mipmap-mdpi": (108, 108),
    "mipmap-hdpi": (162, 162),
    "mipmap-xhdpi": (216, 216),
    "mipmap-xxhdpi": (324, 324),
    "mipmap-xxxhdpi": (432, 432),
}

for folder, size in mipmap_sizes.items():
    target_folder = os.path.join(res_dir, folder)
    os.makedirs(target_folder, exist_ok=True)
    resized = img.resize(size, Image.LANCZOS)
    resized.save(os.path.join(target_folder, "ic_launcher.png"), "PNG")
    resized.save(os.path.join(target_folder, "ic_launcher_round.png"), "PNG")

for folder, size in foreground_sizes.items():
    target_folder = os.path.join(res_dir, folder)
    os.makedirs(target_folder, exist_ok=True)
    fg_resized = img.resize(size, Image.LANCZOS)
    fg_resized.save(os.path.join(target_folder, "ic_launcher_foreground.png"), "PNG")

# 3. Splash screens with sleek dark background (#0a0a0c) and centered Davora logo
splash_sizes = {
    "drawable": (480, 800),
    "drawable-port-mdpi": (320, 480),
    "drawable-port-hdpi": (480, 800),
    "drawable-port-xhdpi": (720, 1280),
    "drawable-port-xxhdpi": (960, 1600),
    "drawable-port-xxxhdpi": (1280, 1920),
    "drawable-land-mdpi": (480, 320),
    "drawable-land-hdpi": (800, 480),
    "drawable-land-xhdpi": (1280, 720),
    "drawable-land-xxhdpi": (1600, 960),
    "drawable-land-xxxhdpi": (1920, 1280),
}

bg_color = (10, 10, 12, 255)

for folder, (w, h) in splash_sizes.items():
    target_folder = os.path.join(res_dir, folder)
    os.makedirs(target_folder, exist_ok=True)
    splash_img = Image.new("RGBA", (w, h), bg_color)
    max_logo_size = int(min(w, h) * 0.38)
    logo_resized = img.resize((max_logo_size, max_logo_size), Image.LANCZOS)
    x = (w - max_logo_size) // 2
    y = (h - max_logo_size) // 2
    splash_img.paste(logo_resized, (x, y), logo_resized)
    splash_img.save(os.path.join(target_folder, "splash.png"), "PNG")

print("Generated all custom Davora launcher icons & splash screens successfully!")
'

    - name: Update Android SDK & Play Billing Library Configuration
      run: |
        sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' android/variables.gradle
        sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g' android/variables.gradle
        echo "repositories { google(); mavenCentral() }" >> android/app/build.gradle
        echo "dependencies { implementation 'com.android.billingclient:billing:8.0.0'; implementation 'com.android.billingclient:billing-ktx:8.0.0' }" >> android/app/build.gradle
        echo "configurations.all { resolutionStrategy { force 'com.android.billingclient:billing:8.0.0', 'com.android.billingclient:billing-ktx:8.0.0' }; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7' }" >> android/app/build.gradle

    - name: Add Microphone Permission to AndroidManifest
      run: |
        sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml

    - name: Upgrade Gradle Wrapper to 8.5
      run: |
        sed -i 's/gradle-8.2.1-all.zip/gradle-8.5-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

    - name: Build Android Binaries
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        ./gradlew bundleDebug
        ./gradlew bundleRelease

    - name: Sign Release AAB Bundle
      run: |
        echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 --decode > android/davora.keystore
        AAB_FILE=$(find android/app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
        echo "Found AAB file: $AAB_FILE"
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore android/davora.keystore "$AAB_FILE" ${{ secrets.ANDROID_ALIAS }} -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} -keypass ${{ secrets.ANDROID_KEY_PASSWORD }}

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: davora-android-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Debug AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: davora-android-debug-aab
        path: android/app/build/outputs/bundle/debug/app-debug.aab

    - name: Upload Release AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: davora-android-release-aab
        path: android/app/build/outputs/bundle/release/*.aab