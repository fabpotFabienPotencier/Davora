name: Build Android App (APK & AAB Bundle)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Ensure Android 36 SDK Platform
      run: |
        yes | sdkmanager --licenses || true
        echo "y" | sdkmanager "platforms;android-36" || true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Build Next.js Static Export
      run: npm run build
      env:
        EXPORT_MOBILE: 'true'

    - name: Install Capacitor Core & Android
      run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/browser@6 @capacitor/push-notifications@6

    - name: Add and Sync Android Platform
      run: |
        npx cap add android
        if [ -f "google-services.json" ]; then
          cp google-services.json android/app/google-services.json
          echo "google-services.json successfully copied to android/app/"
        else
          echo "Warning: google-services.json not found in root"
        fi
        npx cap sync android

    - name: Generate and Apply Davora App Icons & Splash
      run: |
        python3 -m pip install Pillow
        python3 .github/workflows/generate_icons.py

    - name: Configure Android Project (SDK 36, Billing 8, Gradle 8.5)
      run: python3 .github/workflows/configure_android.py

    - name: Build Android Binaries
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        ./gradlew bundleDebug
        ./gradlew bundleRelease

    - name: Sign Release AAB Bundle
      run: |
        echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 --decode > android/davora.keystore
        AAB_FILE=$(find android/app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
        echo "Found AAB file: $AAB_FILE"
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore android/davora.keystore "$AAB_FILE" ${{ secrets.ANDROID_ALIAS }} -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} -keypass ${{ secrets.ANDROID_KEY_PASSWORD }}

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: davora-android-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Debug AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: davora-android-debug-aab
        path: android/app/build/outputs/bundle/debug/app-debug.aab

    - name: Upload Release AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: davora-android-release-aab
        path: android/app/build/outputs/bundle/release/*.aab